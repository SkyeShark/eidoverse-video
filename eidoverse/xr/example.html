<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Eidoverse XR — example</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#05030b;overflow:hidden}
#s{position:fixed;top:12px;left:12px;color:#ffb38f;font:15px/1.5 ui-monospace,monospace;z-index:9;text-shadow:0 0 6px #000;white-space:pre}
</style>
<!-- three.js from node_modules (eidoverse/xr/serve.py serves it): the same build the renderer uses -->
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.webgpu.js",
  "three/webgpu": "/node_modules/three/build/three.webgpu.js",
  "three/tsl": "/node_modules/three/build/three.tsl.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head><body><div id="s">loading…</div>
<script type="module">
// A minimal WebXR page on the kit: a small city you can stand in (STREET, 25 cm a unit) or hold in front of you
// (TABLE, 1 cm a unit). Copy it to start a page. Guide: tools-guides/webxr.md.
//   headset — street: left stick walks where you look, right stick flicks you round 30 degrees, X back to the start
//             table: right stick slides it, left stick turns (x) and scales (y) it, grip re-centres it
//             both: Y street <-> table (into the street where the right hand points), right trigger a flash
//   desktop — street: WASD, drag to look · table: drag to orbit, wheel · V street <-> table · F flash
//   stills  — ?t=4&street=x,z&look=deg&pitch=deg  or  ?t=4&view=table   (eidoverse/xr/shot.mjs)
import * as THREE from 'three';
import { attribute, uniform, float, vec2, vec3, mix, step, abs, fract, min, max, clamp, fwidth, smoothstep, sin, cos,
  color, positionLocal, instanceIndex, hash } from 'three/tsl';
import { telemetry, createRenderer, keepSized, startLoop, WorldRig, Pads, BTN, makeLaser, Desktop, makeVeil } from './xr_kit.js';

const S = document.getElementById('s');
const Q = new URLSearchParams(location.search), STILL = Q.has('t');
const report = telemetry('xr_example');

const { renderer } = await createRenderer({ button: !STILL });
const scene = new THREE.Scene();
scene.background = new THREE.Color('#05030b');
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.02, 400);
scene.add(camera);
keepSized(renderer, camera);

// ------------------------------------------------ the world, in its own units (y up), inside `stage`
const stage = new THREE.Group();
scene.add(stage);
const uTime = uniform(STILL ? +Q.get('t') : 0);
{ // the sky: a dome round your head (not in the stage, so it never scales)
  const m = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, depthWrite: false });
  const h = clamp(positionLocal.normalize().y, 0, 1);
  m.colorNode = mix(mix(color('#2a0c34'), color('#130822'), clamp(h.mul(4), 0, 1)), color('#05030b'), clamp(h.sub(0.15).mul(2), 0, 1));
  globalThis._sky = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), m);
  scene.add(globalThis._sky);
}
{ // the ground: an antialiased grid, one line a unit
  const m = new THREE.MeshBasicNodeMaterial();
  const g = vec2(positionLocal.x, positionLocal.z);
  const d = abs(fract(g.sub(0.5)).sub(0.5)).div(max(fwidth(g), vec2(1e-4)));
  const line = float(1).sub(min(smoothstep(0, 1.2, d.x), smoothstep(0, 1.2, d.y)));
  const fade = clamp(float(1).sub(g.length().div(60)), 0, 1);
  m.colorNode = mix(color('#0b0812'), color('#35e8ff').mul(0.35), line.mul(fade));
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120).rotateX(-Math.PI / 2), m);
  stage.add(ground);
}
{ // towers: one instanced box each, lit windows on every side, a neon rim on top
  const N = 36, off = new Float32Array(N * 4);
  let s = 11; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 + rnd() * 0.15, r = 14 + rnd() * 18;
    off.set([Math.cos(a) * r, Math.sin(a) * r, 3 + rnd() * 3, 6 + rnd() * 22], i * 4);   // x, z, width, height
  }
  const geo = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
  geo.setAttribute('aT', new THREE.InstancedBufferAttribute(off, 4));
  const T = attribute('aT', 'vec4');
  const m = new THREE.MeshBasicNodeMaterial();
  m.positionNode = positionLocal.mul(vec3(T.z, T.w, T.z)).add(vec3(T.x, 0, T.y));
  const g0 = attribute('position', 'vec3'), n = attribute('normal', 'vec3');       // the unit box, before sizing
  const cell = vec2(g0.x.add(g0.z).mul(T.z), g0.y.mul(T.w)).mul(0.8);             // about one window a unit
  const win = step(0.35, fract(cell.x)).mul(step(0.4, fract(cell.y))).mul(step(0.6, hash(instanceIndex.add(floorOf(cell)))));
  const side = float(1).sub(step(0.5, abs(n.y)));
  m.colorNode = mix(color('#1a1626'), color('#ffd28a').mul(1.6), win.mul(side))
    .add(color('#ff3fd0').mul(step(0.5, n.y).mul(0.8)));                            // a neon roof
  const mesh = new THREE.InstancedMesh(geo, m, N);
  mesh.frustumCulled = false;
  stage.add(mesh);
  function floorOf(v) { return v.x.floor().mul(37).add(v.y.floor().mul(113)); }
}
{ // walkers: little boxes going round the square, moved on the GPU from the time alone
  const N = 24, a0 = new Float32Array(N * 2);
  for (let i = 0; i < N; i++) a0.set([(i / N) * Math.PI * 2, 5 + (i % 4) * 2], i * 2);
  const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8).translate(0, 0.4, 0);
  geo.setAttribute('aW', new THREE.InstancedBufferAttribute(a0, 2));
  const W = attribute('aW', 'vec2');
  const ang = W.x.add(uTime.mul(float(0.9).div(W.y)));
  const m = new THREE.MeshBasicNodeMaterial();
  m.positionNode = positionLocal.add(vec3(cos(ang).mul(W.y), abs(sin(uTime.mul(6).add(W.x.mul(9)))).mul(0.25), sin(ang).mul(W.y)));
  m.colorNode = color('#d77757').mul(float(0.8).add(attribute('normal', 'vec3').y.mul(0.3)));
  const mesh = new THREE.InstancedMesh(geo, m, N);
  mesh.frustumCulled = false;
  stage.add(mesh);
}

// ------------------------------------------------ the kit
const START = new THREE.Vector3(0, 0, 10), TOWARD = new THREE.Vector3(0, 0, -1);   // at the square's edge, facing in
const rig = new WorldRig({ renderer, camera, stage, street: 0.25, table: 0.01 });
const pads = new Pads(renderer, scene);
const laser = makeLaser(scene);
const veil = makeVeil(scene);
const desk = new Desktop({ camera, dom: renderer.domElement });
let pointer = null, flashAt = -1e9;
// on the desktop the preview camera moves first, then the world is placed relative to it
const toStreet = (at = START) => { desk.setMode('street'); rig.standAt(at, { facing: TOWARD }); };
const toTable = () => { desk.setMode('table'); rig.toTable({ at: renderer.xr.isPresenting ? null : desk.orbit.at }); };
addEventListener('keydown', (e) => {
  if (renderer.xr.isPresenting) return;
  if (e.key.toLowerCase() === 'v') (rig.mode === 'street' ? toTable : toStreet)();
  if (e.key.toLowerCase() === 'f') flashAt = performance.now();
});

if (STILL) {                                       // a still: stand somewhere, look somewhere, at time ?t=
  S.style.display = 'none';
  if (Q.get('view') === 'table') toTable();
  else {
    const [x, z] = (Q.get('street') || '0,10').split(',').map(Number);
    desk.setMode('street');
    rig.standAt(new THREE.Vector3(x, 0, z), { facing: TOWARD });
    desk.walker.yaw = -THREE.MathUtils.degToRad(+(Q.get('look') || 0));
    desk.walker.pitch = THREE.MathUtils.degToRad(+(Q.get('pitch') || 0));
    desk.apply();
  }
} else toStreet();

let t = uTime.value;
startLoop(renderer, scene, camera, {
  report, still: STILL,
  onSession: () => setTimeout(() => toStreet(), 300),        // once the headset pose is live
  heartbeat: () => { const w = rig.where(); return { mode: rig.mode, at: [+w.x.toFixed(1), +w.z.toFixed(1)] }; },
  onFrame: (now, dt, xr) => {
    if (!STILL) { t += dt; uTime.value = t; }
    if (xr) {
      pads.poll();
      const L = pads.hand('left'), R = pads.hand('right');
      laser.hide();
      if (rig.mode === 'street') {
        rig.walk(L.x, -L.y, dt);
        rig.flick(R.x);
        if (L.edge(BTN.AX)) toStreet();
      } else {
        rig.slide(R.x * 0.9 * dt, -R.y * 0.6 * dt);
        rig.spin(-L.x * 0.9 * dt);
        rig.zoom(Math.exp(-L.y * 0.9 * dt));
        pointer = R.ray && rig.groundHit(R.ray.origin, R.ray.dir);
        if (pointer && pointer.length() < 55) laser.show(R.ray.origin, stage.localToWorld(pointer.clone()));
        else pointer = null;
        if (L.edge(BTN.AX) || L.edge(BTN.GRIP) || R.edge(BTN.GRIP)) rig.toTable();
      }
      if (L.edge(BTN.BY)) {
        if (rig.mode === 'street') rig.toTable(); else rig.standAt(pointer || START, { facing: TOWARD });
        report({ phase: 'button', what: 'view ' + rig.mode });
      }
      if (R.edge(BTN.TRIGGER)) flashAt = now;
    } else if (!STILL) desk.update(dt);
    const f = Math.max(0, 1 - (now - flashAt) / 400);         // a flash, fading over 0.4 s
    veil.set(f * 0.7, '#ffd2a0');
    const H = rig.head().position;
    veil.follow(H);
    globalThis._sky.position.copy(H);
    if (!STILL && !xr && Math.floor(now / 500) !== Math.floor((now - dt * 1000) / 500))
      S.textContent = `EIDOVERSE XR — ${rig.mode}\n` + (rig.mode === 'street' ? 'WASD walk, drag to look' : 'drag to orbit, wheel to zoom') + ' · V street / table · F flash';
  },
});
report({ phase: 'ready', backend: renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2', ua: navigator.userAgent.slice(0, 80) });
window._xr = { THREE, scene, camera, stage, rig, desk, uTime };
</script>
</body></html>
