<script type="module">
// The Blender edition's XR page: a scene exported by eidoblend.xr.export_xr (scene.glb + scene.xr.json beside this
// file), on the kit (eidoverse/xr/xr_kit.js). Guide: tools-guides/webxr.md. The controls are the kit example's:
//   headset — street: left stick walks where you look, right stick flicks you round 30 degrees, X back to the start
//             table: right stick slides it, left stick turns (x) and scales (y) it, grip re-centres it
//             both: Y street <-> table (into the street where the right hand points), right trigger a flash
//   desktop — street: WASD, drag to look · table: drag to orbit, wheel · V street <-> table · F flash
//   stills  — ?t=4&street=x,z&look=deg&pitch=deg&face=deg  or  ?t=4&view=table  or  ?t=4&camera=<exported camera>
//             (+ &shadows=1). street x,z are three's axes: a Blender ground point (x, y) is street=x,-y; face turns
//             the facing you stand with (the stage, its sky and its light turn with it).
import * as THREE from 'three';
import { float, vec2, mix, abs, fract, min, max, clamp, fwidth, smoothstep, color, positionLocal, texture,
  equirectUV, uniform, pmremTexture } from 'three/tsl';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { RectAreaLightTexturesLib } from 'three/addons/lights/RectAreaLightTexturesLib.js';
import { telemetry, createRenderer, keepSized, startLoop, WorldRig, Pads, BTN, makeLaser, Desktop, makeVeil } from '/eidoverse/xr/xr_kit.js';

const MANIFEST = './scene.xr.json';
const S = document.getElementById('s');
const Q = new URLSearchParams(location.search), STILL = Q.has('t');
const fail = (e) => {
  const msg = String((e && e.stack) || e).slice(0, 600);
  window.__shot = 'error: ' + msg.split('\n')[0];
  S.style.display = ''; S.textContent = 'EIDOVERSE XR — failed\n' + msg;
  console.error(e);
};
addEventListener('error', (e) => { if (STILL && !window.__shot) fail(e.error || e.message); });

// ------------------------------------------------ page-side materials: what a GLB cannot hold (objects tagged in Blender
// with the custom property xr_material = '<kind>', params in xr_params; eidoblend.xr.examples' ground uses 'grid')
const PAGE_MATERIALS = {
  // example.html's ground: an antialiased grid, one line a unit (the object's own units), fading out by `fade`
  grid(mesh, p) {
    const m = new THREE.MeshBasicNodeMaterial();
    const g = vec2(positionLocal.x, positionLocal.z);
    const d = abs(fract(g.sub(0.5)).sub(0.5)).div(max(fwidth(g), vec2(1e-4)));
    const line = float(1).sub(min(smoothstep(0, 1.2, d.x), smoothstep(0, 1.2, d.y)));
    const fade = clamp(float(1).sub(g.length().div(p.fade ?? 60)), 0, 1);
    m.colorNode = mix(color(p.dark ?? '#0b0812'), color(p.line ?? '#35e8ff').mul(p.line_scale ?? 0.35), line.mul(fade));
    mesh.material = m;
  },
};

// ------------------------------------------------ KHR_animation_pointer: the film's animated material values, camera
// lenses and light values (Blender's glTF exporter writes them as pointer channels; three's GLTFLoader reads only node
// channels and skips these). Read here as tracks, sampled on the film's clock by applyPointers below.
class AnimationPointerPlugin {
  constructor(parser) { this.parser = parser; this.name = 'KHR_animation_pointer'; }
  async afterRoot(result) {
    const json = this.parser.json, tracks = [];
    for (const anim of json.animations || []) for (const ch of anim.channels) {
      const ext = ch.target.extensions && ch.target.extensions.KHR_animation_pointer;
      if (ch.target.path !== 'pointer' || !ext) continue;
      const s = anim.samplers[ch.sampler];
      const [input, output] = await Promise.all([this.parser.getDependency('accessor', s.input),
        this.parser.getDependency('accessor', s.output)]);
      tracks.push({ pointer: ext.pointer, t: input.array, v: output.array, size: output.itemSize,
        interp: s.interpolation || 'LINEAR' });
    }
    result.userData.pointerTracks = tracks;
  }

  const last = ts.length - 1;
  if (t <= ts[0] || last === 0) { for (let j = 0; j < n; j++) out[j] = tr.v[k0 + j]; return out; }
  if (t >= ts[last]) { for (let j = 0; j < n; j++) out[j] = tr.v[last * stride + k0 + j]; return out; }
  let lo = 0, hi = last;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (ts[mid] <= t) lo = mid; else hi = mid; }
  const dt = ts[hi] - ts[lo], u = (t - ts[lo]) / dt;
  for (let j = 0; j < n; j++) {
    const a = tr.v[lo * stride + k0 + j], b = tr.v[hi * stride + k0 + j];
    if (tr.interp === 'STEP') out[j] = a;
    else if (cubic) {
      const ma = tr.v[lo * stride + 2 * n + j] * dt, mb = tr.v[hi * stride + j] * dt, u2 = u * u, u3 = u2 * u;
      out[j] = (2 * u3 - 3 * u2 + 1) * a + (u3 - 2 * u2 + u) * ma + (-2 * u3 + 3 * u2) * b + (u3 - u2) * mb;
    } else out[j] = a + (b - a) * u;
  }

};

try {
  const man = await (await fetch(MANIFEST)).json();
  const report = telemetry('xr_' + man.name);
  const { renderer } = await createRenderer({ button: !STILL });
  renderer.toneMapping = { None: THREE.NoToneMapping, AgX: THREE.AgXToneMapping, Neutral: THREE.NeutralToneMapping,
    ACESFilmic: THREE.ACESFilmicToneMapping }[man.view.tone_mapping] ?? THREE.AgXToneMapping;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color().setRGB(...man.background, THREE.LinearSRGBColorSpace);
  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.02, 3000);
  scene.add(camera);
  keepSized(renderer, camera);

  // ------------------------------------------------ the world, in Blender metres (y up), inside `stage`
  const stage = new THREE.Group();
  scene.add(stage);
  const loader = new GLTFLoader();
  loader.setDRACOLoader(new DRACOLoader().setDecoderPath('/node_modules/three/examples/jsm/libs/draco/gltf/'));
  loader.setMeshoptDecoder(MeshoptDecoder);

  loader.register((parser) => { gltfParser = parser; return new AnimationPointerPlugin(parser); });
  const gltf = await loader.loadAsync(man.glb);
  stage.add(gltf.scene);

  // keeps them); the GLB carries the character's motion and stand-in materials that name the MToon material they
  // stand for (userData.xr_mtoon_from). three-vrm's MToon (its node material, for this renderer) replaces each stand-in,
  // with its outline where the MToon has one (the outline drawn as a second pass of the same geometry, as three-vrm
  // draws it). Nothing else of the .vrm is used: the GLB's own joints play the film's motion, springs included
  const mtoon = { materials: 0, outlines: 0, files: [] };

    const { VRMLoaderPlugin, MToonMaterialLoaderPlugin } = await import('@pixiv/three-vrm');
    const { MToonNodeMaterial } = await import('@pixiv/three-vrm-materials-mtoon/nodes');
    const byName = {};

      const vl = new GLTFLoader();
      vl.register((parser) => new VRMLoaderPlugin(parser, {
        mtoonMaterialPlugin: new MToonMaterialLoaderPlugin(parser, { materialType: MToonNodeMaterial }) }));
      const vg = await vl.loadAsync(v.file);
      mtoon.files.push(v.file);
      vg.scene.traverse((o) => {
        if (!o.isMesh) return;
        for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
          if (!m || !m.isMToonNodeMaterial) continue;
          const name = m.isOutline ? m.name.replace(/ \(Outline\)$/, '') : m.name;
          const e = byName[name] || (byName[name] = {});

      if (!o.isMesh || Array.isArray(o.material)) return;

    });

  const onSet = (p) => p.x >= bounds.min.x && p.x <= bounds.max.x && p.z >= bounds.min.z && p.z <= bounds.max.z;
  const named = (n) => gltf.scene.getObjectByName(THREE.PropertyBinding.sanitizeNodeName(n)) || gltf.scene.getObjectByName(n);

    if (o.isMesh) for (const m of (Array.isArray(o.material) ? o.material : [o.material]))
      for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap', 'alphaMap'])
        if (m[k]) m[k].anisotropy = ANISO;
  });

  const rects = {};                                            // by name: their keyed energy plays from choreo.json too
  if (man.rect_lights && man.rect_lights.length) {
    THREE.RectAreaLightNode.setLTC(RectAreaLightTexturesLib.init());
    for (const r of man.rect_lights) {
      const li = new THREE.RectAreaLight(new THREE.Color().setRGB(...r.color, THREE.LinearSRGBColorSpace), r.intensity, r.width, r.height);
      li.name = r.name;
      li.position.set(...r.position);
      li.quaternion.set(...r.quaternion);

      rects[r.name] = li;
    }
  }

  // it, but light does not scale on its own: a point or spot light's candela falls off with the square of the distance,
  // which the stage shrinks (on a 1:25 table a lamp would light the set 625 times brighter), and a RectAreaLight's
  // width and height are not scaled by its parents (three takes only its rotation). So each frame, s = the stage's
  // scale: point and spot lights shine with their intensity x s^2 (their range x s), area lights are s times their
  // size (the same solid angle, so the same light), and spot shadow cameras cover s times their range. Sun, sky and
  // emission do not change with scale. At s = 1 (life size, or a camera= still) nothing changes.

  // along it, but a Blender sun has no place: eidoblend's robot example and the flora tests leave theirs at the origin,
  // under the set, where a fixed box round the light saw nothing above the ground (no shadow at all). So each frame the
  // box is fitted round the set's bounds as the light sees them, its near and far included, wherever the light stands
  // and at any stage scale or turn

    for (const q of setCorners) _box.expandByPoint(_p.copy(q).applyMatrix4(stage.matrixWorld).applyMatrix4(c.matrixWorldInverse));
    if (_box.isEmpty()) return;

    c.left = _box.min.x - pad; c.right = _box.max.x + pad; c.bottom = _box.min.y - pad; c.top = _box.max.y + pad;
    c.near = -_box.max.z - pad; c.far = -_box.min.z + pad;    // (a negative near: the set behind the light is in it too)

    // room (m), two of them off the surface along its normal and one in depth (three's bias is a fraction of the box's
    // depth): a low sun across a fitted box no longer streaks the lit ground and balls with acne

    L.shadow.normalBias = 2 * texel;

    const s = stage.scale.x;
    for (const [L, f] of falloff) { L.intensity = f.base * s * s; L.distance = f.range * s; }
    for (const r of man.rect_lights || []) { const li = rects[r.name]; li.width = r.width * s; li.height = r.height * s; }
    for (const L of shadowed) {
      const c = L.shadow.camera;

  // world that changes over the film comes as a timed sequence (man.world.sequence: [{t, file}]): the dome cross-fades
  // between the two images either side of the film's time, and the image-based light steps to the nearer one through
  // one environment node whose image changes (each image's prefiltered environment is made once, at load, and no
  // material is rebuilt when the light steps; scene.environment stays set, as three turns the light by
  // scene.environmentRotation while it is)

    const dir = equirectUV(positionLocal.normalize());

  const EXT_COLOR = { sheenColorFactor: 'sheenColor', specularColorFactor: 'specularColor', attenuationColor: 'attenuationColor' };
  const LIN = THREE.LinearSRGBColorSpace;
  // each track's setter: what the value does to its targets (null: a pointer the page does not know, reported)
  const pointerSetter = (ptr) => {
    const p = ptr.split('/').slice(1), kind = p[0], targets = (byIndex[kind] || {})[p[1]] || [], rest = p.slice(2).join('/');
    const each = (f) => (v) => { for (const x of targets) f(x, v); };
    if (kind === 'materials') {
      const tt = rest.match(/^(.*)\/extensions\/KHR_texture_transform\/(offset|rotation|scale)$/);
      if (tt) return each((m, v) => { for (const k of MAPS[tt[1]] || []) { const tex = m[k]; if (!tex) continue;
        if (tt[2] === 'offset') tex.offset.set(v[0], v[1]); else if (tt[2] === 'rotation') tex.rotation = v[0]; else tex.repeat.set(v[0], v[1]); } });
      if (rest === 'pbrMetallicRoughness/baseColorFactor') return each((m, v) => { m.color.setRGB(v[0], v[1], v[2], LIN); m.opacity = v[3]; });
      if (rest === 'pbrMetallicRoughness/metallicFactor') return each((m, v) => { m.metalness = v[0]; });
      if (rest === 'pbrMetallicRoughness/roughnessFactor') return each((m, v) => { m.roughness = v[0]; });
      if (rest === 'emissiveFactor') return each((m, v) => { m.emissive.setRGB(v[0], v[1], v[2], LIN); });
      if (rest === 'extensions/KHR_materials_emissive_strength/emissiveStrength') return each((m, v) => { m.emissiveIntensity = v[0]; });
      if (rest === 'alphaCutoff') return each((m, v) => { m.alphaTest = v[0]; });
      if (rest === 'occlusionTexture/strength') return each((m, v) => { m.aoMapIntensity = v[0]; });
      if (rest === 'normalTexture/scale') return each((m, v) => { m.normalScale.set(v[0], Math.sign(m.normalScale.y || 1) * v[0]); });
      const ex = rest.match(/^extensions\/KHR_materials_\w+\/(\w+)$/);
      if (ex && EXT[ex[1]]) return each((m, v) => { m[EXT[ex[1]]] = v[0]; });
      if (ex && EXT_COLOR[ex[1]]) return each((m, v) => { if (m[EXT_COLOR[ex[1]]]) m[EXT_COLOR[ex[1]]].setRGB(v[0], v[1], v[2], LIN); });
    } else if (kind === 'cameras') {
      const f = { 'perspective/yfov': (c, v) => { c.fov = THREE.MathUtils.radToDeg(v[0]); }, 'perspective/znear': (c, v) => { c.near = v[0]; },
        'perspective/zfar': (c, v) => { c.far = v[0]; }, 'orthographic/xmag': (c, v) => { c.left = -v[0]; c.right = v[0]; },
        'orthographic/ymag': (c, v) => { c.bottom = -v[0]; c.top = v[0]; }, 'orthographic/znear': (c, v) => { c.near = v[0]; },
        'orthographic/zfar': (c, v) => { c.far = v[0]; } }[rest];
      if (f) return each((c, v) => { f(c, v); c.updateProjectionMatrix(); });
    } else if (p[0] === 'extensions' && p[1] === 'KHR_lights_punctual') {
      const ls = byIndex.lights[p[3]] || [], sub = p.slice(4).join('/');
      const eachL = (f) => (v) => { for (const L of ls) f(L, v); };
      if (sub === 'color') return eachL((L, v) => L.color.setRGB(v[0], v[1], v[2], LIN));
      if (sub === 'intensity') return eachL((L, v) => setIntensity(L, v[0]));
      if (sub === 'range') return eachL((L, v) => { const fo = falloff.get(L); if (fo) fo.range = v[0]; else L.distance = v[0]; });
      if (sub === 'spot/outerConeAngle') return eachL((L, v) => { L.userData.inner = L.userData.inner ?? L.angle * (1 - L.penumbra); L.angle = v[0]; L.penumbra = 1 - L.userData.inner / v[0]; });
      if (sub === 'spot/innerConeAngle') return eachL((L, v) => { L.userData.inner = v[0]; L.penumbra = 1 - v[0] / L.angle; });
    }
    return null;
  };
  const pointers = (gltf.userData.pointerTracks || []).map((tr) => ({ ...tr, set: pointerSetter(tr.pointer), out: new Array(tr.size) }));
  const unknownPointers = pointers.filter((p) => !p.set).map((p) => p.pointer);
  if (unknownPointers.length) report({ phase: 'warn', what: 'animation pointers the page does not play', pointers: unknownPointers.slice(0, 20) });
  const applyPointers = (t) => { for (const p of pointers) if (p.set) p.set(sampleTrack(p, t, p.out)); };
  const applySky = (t) => {
    if (!skySeq) return;
    const ts = skySeq.t, last = ts.length - 1;
    let i = 0; while (i < last - 1 && ts[i + 1] <= t) i++;
    const k = Math.min(1, Math.max(0, (t - ts[i]) / (ts[i + 1] - ts[i])));
    skySeq.texA.value = skySeq.maps[i]; skySeq.texB.value = skySeq.maps[i + 1]; skySeq.skyMix.value = k;
    const near = k < 0.5 ? i : i + 1;
    if (near !== skySeq.shown) { skySeq.envLight.value = skySeq.maps[near]; skySeq.shown = near; }
    skySeq.at = i + k;
  };
  // the film's sound (man.audio: the scene's mixdown) on the film's clock: it starts with the first touch, click or key
  // (or the headset session), as browsers only play sound after one, and is pulled back onto the clock whenever it
  // drifts a tenth of a second, the loop included
  const audio = man.audio && man.audio.file ? new Audio(man.audio.file) : null;
  if (audio) {
    audio.preload = 'auto';
    if (STILL) await new Promise((r) => { audio.addEventListener('loadedmetadata', r, { once: true });   // (its length
      audio.addEventListener('error', r, { once: true }); setTimeout(r, 5000); });                    // for the report)
  }
  const startAudio = () => { if (audio && audio.paused && !STILL) audio.play().catch(() => {}); };
  addEventListener('pointerdown', startAudio); addEventListener('keydown', startAudio);
  const syncAudio = (t) => {
    if (!audio || audio.paused) return;
    const want = t + (man.audio.offset || 0);
    if (Math.abs(audio.currentTime - want) > 0.1) audio.currentTime = want;
  };
  const setTime = (t) => { mixer.setTime(t); applyPointers(t); applyTracks(t); applySky(t); };

  // ------------------------------------------------ the kit
  const START = new THREE.Vector3(...man.start), TOWARD = new THREE.Vector3(...man.facing);
  const CENTRE = new THREE.Vector3(...(man.table_centre || [0, 0, 0]));
  const rig = new WorldRig({ renderer, camera, stage, street: man.street, table: man.table, eyeHeight: man.eye_height || 1.6 });
  const pads = new Pads(renderer, scene);
  const laser = makeLaser(scene);
  const veil = makeVeil(scene);
  const desk = new Desktop({ camera, dom: renderer.domElement, eyeHeight: man.eye_height || 1.6 });
  let pointer = null, flashAt = -1e9, viaCamera = null;
  const toStreet = (p = START) => { desk.setMode('street'); rig.standAt(p, { facing: TOWARD }); };
  const toTable = () => { desk.setMode('table'); rig.toTable({ centre: CENTRE, at: renderer.xr.isPresenting ? null : desk.orbit.at }); };
  addEventListener('keydown', (e) => {
    if (renderer.xr.isPresenting) return;
    if (e.key.toLowerCase() === 'v') (rig.mode === 'street' ? toTable : toStreet)();
    if (e.key.toLowerCase() === 'f') flashAt = performance.now();
  });

  const T0 = STILL ? +Q.get('t') : 0;
  if (STILL) {                                       // a still: stand somewhere, look somewhere, at time ?t=
    S.style.display = 'none';
    setTime(T0);
    if (Q.get('camera')) {                           // through an exported camera, the world at life size
      const c = named(Q.get('camera'));
      const cam = c && (c.isCamera ? c : c.children.find((x) => x.isCamera));
      if (!cam) throw new Error('no exported camera ' + Q.get('camera') + ' (cameras: ' + (man.cameras || []).join(', ') + ')');
      stage.position.set(0, 0, 0); stage.rotation.set(0, 0, 0); stage.scale.setScalar(1);
      scene.updateMatrixWorld(true);
      cam.matrixWorld.decompose(camera.position, camera.quaternion, new THREE.Vector3());
      camera.fov = cam.fov; camera.near = cam.near; camera.far = Math.max(cam.far, 100);
      camera.updateProjectionMatrix();
      if (sky) sky.scale.setScalar(Math.min(1, (0.9 * camera.far) / 1500));   // the dome inside the camera's far plane
      viaCamera = cam.name;
    } else if (Q.get('view') === 'table') toTable();
    else {
      const [x, z] = (Q.get('street') || `${START.x},${START.z}`).split(',').map(Number);
      desk.setMode('street');
      // face=deg turns the facing about the vertical (positive to the left): the stage, its sky and its light turn
      const facing = TOWARD.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(+(Q.get('face') || 0)));
      rig.standAt(new THREE.Vector3(x, 0, z), { facing });
      desk.walker.yaw = -THREE.MathUtils.degToRad(+(Q.get('look') || 0));
      desk.walker.pitch = THREE.MathUtils.degToRad(+(Q.get('pitch') || 0));
      desk.apply();
    }
  } else { toStreet(); setTime(0); }

  let t = T0, tris = 0, calls = 0;
  startLoop(renderer, scene, camera, {
    report, still: STILL,
    onSession: () => { setTimeout(() => toStreet(), 300); startAudio(); },   // once the headset pose is live
    heartbeat: () => { const w = rig.where(); return { mode: rig.mode, at: [+w.x.toFixed(2), +w.z.toFixed(2)], t: +t.toFixed(2) }; },
    onFrame: (now, dt, xr) => {
      if (!STILL) {
        t += dt; if (duration > 0 && t > duration) t -= duration;
        setTime(t);                                            // the film's clock, looped (one clip: cheap)
        syncAudio(t);
      }
      if (xr) {
        pads.poll();
        const L = pads.hand('left'), R = pads.hand('right');
        laser.hide();
        if (rig.mode === 'street') {
          rig.walk(L.x, -L.y, dt);
          rig.flick(R.x);
          if (L.edge(BTN.AX)) toStreet();
        } else {
          rig.slide(R.x * 0.9 * dt, -R.y * 0.6 * dt);
          rig.spin(-L.x * 0.9 * dt);
          rig.zoom(Math.exp(-L.y * 0.9 * dt));
          pointer = R.ray && rig.groundHit(R.ray.origin, R.ray.dir);
          if (pointer && onSet(pointer)) laser.show(R.ray.origin, stage.localToWorld(pointer.clone()));
          else pointer = null;
          if (L.edge(BTN.AX) || L.edge(BTN.GRIP) || R.edge(BTN.GRIP)) rig.toTable({ centre: CENTRE });
        }
        if (L.edge(BTN.BY)) {
          if (rig.mode === 'street') rig.toTable({ centre: CENTRE }); else rig.standAt(pointer || START, { facing: TOWARD });
          report({ phase: 'button', what: 'view ' + rig.mode });
        }
        if (R.edge(BTN.TRIGGER)) flashAt = now;
      } else if (!STILL) desk.update(dt);
      const f = Math.max(0, 1 - (now - flashAt) / 400);         // a flash, fading over 0.4 s
      veil.set(f * 0.7, '#ffd2a0');
      const H = rig.head().position;
      veil.follow(H);
      if (sky) { sky.position.copy(H); sky.rotation.y = stage.rotation.y; }
      scene.environmentRotation.y = stage.rotation.y;
      const s = relight();                                     // after the rig and the tracks have had their say
      if (STILL) {
        window.__shotInfo = { t, clips: gltf.animations.length, duration: +duration.toFixed(3), meshes: nMeshes,
          pageMaterials: nTagged, rect: (man.rect_lights || []).length, world: !!sky, tris, calls, camera: viaCamera,
          mode: viaCamera ? 'camera' : rig.mode, toneMapping: man.view.tone_mapping, stageScale: s, shadows: SHADOWS,
          environment: scene.environment ? (sky ? 'world.hdr' : 'uniform') : null, anisotropy: ANISO,
          sunShadow: shadowed.filter((L) => L.isDirectionalLight).map((L) => { const c = L.shadow.camera;
            return [c.left, c.right, c.bottom, c.top, c.near, c.far].map((x) => +x.toFixed(4)); }),
          rectIntensity: Object.fromEntries(Object.entries(rects).map(([n, l]) => [n, +l.intensity.toFixed(4)])),
          rectSize: Object.fromEntries(Object.entries(rects).map(([n, l]) => [n, [+l.width.toFixed(5), +l.height.toFixed(5)]])),
          pointIntensity: Object.fromEntries([...falloff].map(([L, fo]) => [L.name, [+L.intensity.toPrecision(6), +fo.base.toPrecision(6)]])),
          pointers: pointers.length, pointersPlayed: pointers.filter((p) => p.set).length, unknownPointers,
          mtoon, sky: skySeq ? { images: skySeq.maps.length, at: +skySeq.at.toFixed(4) } : null,
          audio: audio ? { file: man.audio.file, duration: +(audio.duration || 0).toFixed(3), ready: audio.readyState } : null,
          cameraFov: viaCamera ? +camera.fov.toFixed(4) : null };
        // three resets renderer.info as each animation frame starts (before onFrame): read the counts once it is drawn
        setTimeout(() => { tris = renderer.info.render.triangles; calls = renderer.info.render.drawCalls;
          Object.assign(window.__shotInfo, { tris, calls }); }, 0);
      }
      if (!STILL && !xr && Math.floor(now / 500) !== Math.floor((now - dt * 1000) / 500))
        S.textContent = `EIDOVERSE XR — ${man.name} — ${rig.mode}  t ${t.toFixed(1)} / ${duration.toFixed(1)} s\n` +
          (rig.mode === 'street' ? 'WASD walk, drag to look' : 'drag to orbit, wheel to zoom') + ' · V street / table · F flash';
    },
  });
  report({ phase: 'ready', backend: renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2', ua: navigator.userAgent.slice(0, 80),
    clips: gltf.animations.length, duration, meshes: nMeshes });
  window._xr = { THREE, scene, camera, stage, rig, desk, mixer, gltf, man, setTime, pointers, audio };
} catch (e) { fail(e); }
</script>
</body></html>
